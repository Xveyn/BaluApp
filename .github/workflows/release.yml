name: Release APK

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the ancestry check below needs main's commits.
          fetch-depth: 0

      - name: Parse tag and derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Each component must be "0" or start with a non-zero digit (SemVer's own
          # rule). A bare [0-9]+ would let bash arithmetic below treat a leading
          # zero as octal (v1.08.0 -> parse error) or silently collide versions
          # (v1.007.0 -> the same code as v1.7.0).
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form v<major>.<minor>.<patch>"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::minor and patch must stay below 100, or the versionCode formula loses monotonicity"
            exit 1
          fi
          if (( MAJOR == 0 && MINOR == 0 && PATCH == 0 )); then
            echo "::error::v0.0.0 would produce versionCode 0, which AGP accepts but the Play Store rejects"
            exit 1
          fi
          echo "name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is reachable from main
        run: |
          # Explicit refspec: relying on actions/checkout's default refspec means a
          # missing ref would fail merge-base with a misleading "not reachable"
          # verdict instead of the real cause.
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not reachable from main — refusing to release from a side branch"
            exit 1
          fi

      - name: Extract release notes from the changelog
        run: |
          NAME="${{ steps.version.outputs.name }}"
          # Stops at the next "## [" heading, or at a link-reference-definition line
          # ("[1.0.0]: https://...") once the changelog grows those at the bottom —
          # otherwise the oldest version's section would run to EOF and swallow them.
          awk -v v="## [$NAME]" '
            index($0, v) == 1 { found=1; next }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::CHANGELOG.md has no non-empty section for $NAME"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      # Same reasoning as in ci.yml: without --no-build-cache the task can be
      # served FROM-CACHE and report success without running anything. A release
      # is the last place that should happen.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-build-cache --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/baluhost-release.jks

      # --no-build-cache here too: setup-gradle's shared build cache can be
      # populated by any run in this repo (e.g. an unrelated development push),
      # and this is the one build whose compiled/dexed/R8'd output is signed and
      # handed to users. It must not inherit outputs from a cache it didn't build.
      - name: Build release APK
        env:
          KEYSTORE_PATH: baluhost-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon --no-build-cache
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the APK carries the tag's version
        run: |
          BADGING=$("$ANDROID_HOME"/build-tools/*/aapt2 dump badging app/build/outputs/apk/release/app-release.apk)
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.name }}'" \
            || { echo "::error::APK versionName does not match ${{ steps.version.outputs.name }}"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NAME="${{ steps.version.outputs.name }}"
          # Create as a draft, upload the asset, then publish. "gh release create"
          # with an asset does both steps internally — if the upload half fails
          # (transient network, a 30-40 MB APK), the release is already public and
          # empty, and re-running dies at "create" with "release already exists"
          # since it can never repair itself. A draft is invisible to users and
          # safe to retry into.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "Release $NAME" --notes-file release-notes.md
          gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk --clobber
          gh release edit "$TAG" --draft=false
